name: Testes MiniGestao

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: npm test
      - run: node --check src/index.js
      - run: node --check src/v3.js
      - run: node --check src/machines.js
      - run: node --check src/settlement.js
      - run: node --check public/app.js
      - run: node --check public/features.js
      - run: node --check public/fleet.js
      - run: node --check public/finance.js
      - run: node --check scripts/smoke-test.mjs
